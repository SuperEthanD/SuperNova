<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add your Website - SuperNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="browser-container">
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="back-btn" class="btn" title="Back">←</button>
                <button id="forward-btn" class="btn" title="Forward">→</button>
                <button id="reload-btn" class="btn" title="Reload">↻</button>
            </div>
            <div class="address-bar-container">
                <input type="text" id="url-input" readonly>
            </div>
        </div>

        <div class="viewport">
            <div class="subpage-header">
                <a href="Home.html" class="results-logo">
                    <span class="text-super-sm">SUPER</span><span class="box-nova-sm">NOVA</span>
                </a>
                <span class="subpage-title-badge">Developer & Creator Portal</span>
            </div>

            <div class="subpage-body">
                <div class="content-card">
                    <h2>Add your Website</h2>
                    <p class="subtitle">Submit a URL to the SuperNova search index so it appears at the top of search results.</p>

                    <form id="add-site-form">
                        <div class="form-group">
                            <label for="site-title-input">Website Title *</label>
                            <input type="text" id="site-title-input" placeholder="e.g., Galaxy Explorer" required>
                        </div>

                        <div class="form-group">
                            <label for="site-url-input">Website URL *</label>
                            <input type="text" id="site-url-input" placeholder="e.g., https://example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="site-desc-input">Description & Keywords</label>
                            <textarea id="site-desc-input" placeholder="Briefly describe what your website is about..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="primary-btn">Index Website</button>
                            <a href="Home.html" class="secondary-btn">Back to Home</a>
                        </div>
                    </form>
                    <div id="add-site-feedback" class="feedback-msg"></div>
                </div>

                <div class="indexed-list-container">
                    <h3>Currently Indexed Websites (<span id="indexed-count">0</span>)</h3>
                    <div id="indexed-sites-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const form = document.getElementById('add-site-form');
        const titleInput = document.getElementById('site-title-input');
        const urlField = document.getElementById('site-url-input');
        const descInput = document.getElementById('site-desc-input');
        const feedback = document.getElementById('add-site-feedback');
        const listEl = document.getElementById('indexed-sites-list');
        const countEl = document.getElementById('indexed-count');

        function renderSites() {
            const sites = getCustomSites();
            countEl.textContent = sites.length;

            if (sites.length === 0) {
                listEl.innerHTML = '<p style="color: #718096; font-size: 13px;">No custom websites indexed yet.</p>';
                return;
            }

            listEl.innerHTML = sites.map((site, index) => `
                <div class="indexed-site-card">
                    <div class="indexed-site-info">
                        <h4>${site.title}</h4>
                        <span>${site.url}</span>
                    </div>
                    <button class="delete-site-btn" data-index="${index}">Remove</button>
                </div>
            `).join('');

            document.querySelectorAll('.delete-site-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'), 10);
                    const updated = getCustomSites();
                    updated.splice(idx, 1);
                    saveCustomSites(updated);
                    renderSites();
                });
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = titleInput.value.trim();
            let url = urlField.value.trim();
            const snippet = descInput.value.trim() || "Submitted via SuperNova Developer Portal.";

            if (!title || !url) return;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const sites = getCustomSites();
            sites.unshift({ title, url, snippet });
            saveCustomSites(sites);

            titleInput.value = '';
            urlField.value = '';
            descInput.value = '';

            feedback.textContent = `✓ "${title}" is now live in SuperNova search results!`;
            feedback.style.display = 'block';
            renderSites();
        });

        renderSites();
    </script>
</body>
</html>
