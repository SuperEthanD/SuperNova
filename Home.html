<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Buttons</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #f4f4f4;
      font-family: sans-serif;
    }

    .button-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .button-container button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .button-container button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>



  <div class="button-container">
    <a href="Add-Website.html">
    <button>Add your Website</button>

    <a href="About.html">
    <button>About</button>

    <a href="Settings.html">
    <button>Settings</button>
  </div>


</body>
</html>
