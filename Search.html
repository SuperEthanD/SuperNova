<style>

.rectangular-search {
border-radius: 0px;
border: 2px solid #333333;
padding: 10px 15px;
font-size: 16px;

}

/* Optional: Style when clicking inside */

border-color: #007BFF;

}

</style>
</head>
<body>

<div class="body">

<h2 style="font-family: 'Trebuchet MS', sans-serif; color: white;">Travel the Galaxy!</h2>

<!-- Search Bar -->
<div class="search-container">
<div><input type="text" class="rectangular-search" placeholder="Search Anything">

<style>
        .rectangular-searchButton {
            /* Removes rounded corners */
            border-radius: 0px; 
            border: 2px solid #333333; 
            padding: 12px 15px;
            font-size: 15px; 
            color: white;
            width: 60px; 
            outline: none;
            background-color: #007BFF
        }
        .rectangular-search:focus {
            border-color: #007BFF; 
        }
    </style>
            <button class="rectangular-searchButton">Go!</i> </button></div>

<!-- Container where results will appear -->
  <div id="searchResults"></div>

    <script>
        // 1. Your website content database (Array of Objects)
        const websiteData = [
            { title: "About Us", content: "Learn more about our company history, mission, and team members.", url: "about.html" },
            { title: "Our Services", content: "We offer web design, mobile app development, and SEO optimization services.", url: "services.html" },
            { title: "Contact Info", content: "Get in touch with us via email, phone, or visit our office headquarters.", url: "contact.html" },
            { title: "JavaScript Tutorial", content: "Learn how to code JavaScript from scratch with simple examples.", url: "js-tutorial.html" },
            { title: "HTML Basics", content: "Master the structure of web pages using HTML5 tags and elements.", url: "html-basics.html" }
        ];

        // 2. Grab HTML elements
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const searchResults = document.getElementById('searchResults');

        // 3. Define the search function
        function performSearch() {
            // Get user input and convert to lowercase for case-insensitive matching
            const query = searchInput.value.toLowerCase().trim();
            
            // Clear previous results
            searchResults.innerHTML = '';

            // If input is empty, don't search
            if (query === '') {
                searchResults.innerHTML = '<p class="no-results">Please enter a search term.</p>';
                return;
            }

            // Filter data matching title or content
            const filteredResults = websiteData.filter(item => {
                return item.title.toLowerCase().includes(query) || 
                       item.content.toLowerCase().includes(query);
            });

            // Display results
            if (filteredResults.length === 0) {
                searchResults.innerHTML = '<p class="no-results">No results found matching your query.</p>';
            } else {
                filteredResults.forEach(item => {
                    const resultDiv = document.createElement('div');
                    resultDiv.classList.add('result-item');
                    resultDiv.innerHTML = `
                        <h3><a href="${item.url}">${item.title}</a></h3>
                        <p>${item.content}</p>
                    `;
                    searchResults.appendChild(resultDiv);
                });
            }
        }

        // 4. Trigger search on button click
        searchButton.addEventListener('click', performSearch);

        // Optional: Trigger search when user presses "Enter" key inside the input field
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>

</body>
