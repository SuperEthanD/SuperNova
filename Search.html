<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperNova Browser Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="browser-container">
        <!-- Top Browser Navigation Bar -->
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="back-btn" class="btn" title="Back">←</button>
                <button id="forward-btn" class="btn" title="Forward">→</button>
                <button id="reload-btn" class="btn" title="Reload">↻</button>
            </div>
            <div class="address-bar-container">
                <input type="text" id="url-input" value="http://localhost:9898/SuperNova/Home.html" readonly>
            </div>
        </div>

        <!-- Main Viewport Window -->
        <div class="viewport">
            
            <!-- VIEW A: SuperNova Homepage -->
            <div id="homepage-view" class="page-container active">
                <div class="main-content">
                    <!-- Split Box Logo Design -->
                    <div class="logo-container">
                        <span class="text-super">SUPER</span>
                        <span class="box-nova">NOVA</span>
                    </div>
                    <p class="tagline">Travel the Galaxy!</p>
                    
                    <!-- Search Controls -->
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Search Anything...">
                        <button id="go-btn">Go!</button>
                    </div>
                </div>

                <!-- Bottom Right Utility Cluster -->
                <div class="footer-buttons">
                    <button class="footer-btn">Add your Website</button>
                    <button class="footer-btn">About</button>
                    <button class="footer-btn">Settings</button>
                </div>
            </div>

            <!-- VIEW B: Dynamic Search Results Page -->
            <div id="results-view" class="page-container">
                <div class="results-header">
                    <div class="results-logo" id="logo-return">
                        <span class="text-super-sm">SUPER</span><span class="box-nova-sm">NOVA</span>
                    </div>
                    <div class="results-search-box">
                        <input type="text" id="results-search-input">
                        <button id="results-go-btn">Search</button>
                    </div>
                </div>
                
                <!-- Results Output Destination -->
                <div class="results-body">
                    <p class="search-summary">Showing results for: <span id="query-highlight"></span></p>
                    <div id="results-list"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body, html {
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #0b1d3a;
    overflow: hidden;
    color: #ffffff;
}

.browser-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
}

/* Browser Toolbar Control UI */
.toolbar {
    display: flex;
    align-items: center;
    background-color: #18181b;
    padding: 8px;
    gap: 12px;
    border-bottom: 1px solid #27272a;
}

.nav-buttons {
    display: flex;
    gap: 6px;
}

.btn {
    background: none;
    border: none;
    color: #a1a1aa;
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
}

.btn:hover {
    background-color: #27272a;
    color: #ffffff;
}

.address-bar-container {
    flex-grow: 1;
}

#url-input {
    width: 100%;
    height: 32px;
    background-color: #09090b;
    border: 1px solid #27272a;
    border-radius: 6px;
    color: #71717a;
    padding: 0 12px;
    font-size: 13px;
    outline: none;
}

/* View Framework */
.viewport {
    flex-grow: 1;
    position: relative;
    width: 100%;
    height: 100%;
}

.page-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
}

.page-container.active {
    display: flex;
}

/* Homepage View Panel Styles */
#homepage-view {
    background: radial-gradient(circle at center, #0c2b5e 0%, #030e21 100%);
    justify-content: center;
    align-items: center;
}

.main-content {
    text-align: center;
    margin-bottom: 80px;
}

/* Core Split Logo Element */
.logo-container {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
}

.text-super {
    color: #ffffff;
    margin-right: 10px;
}

.box-nova {
    background-color: #ffffff;
    color: #030e21;
    padding: 2px 14px;
    border-radius: 4px;
}

.tagline {
    font-size: 18px;
    color: #a0c4ff;
    margin-bottom: 30px;
}

/* Search input components */
.search-box {
    display: flex;
    width: 520px;
    max-width: 90vw;
    background-color: #ffffff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}

#search-input {
    flex-grow: 1;
    border: none;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
    color: #333333;
}

#go-btn {
    background-color: #0077ff;
    color: #ffffff;
    border: none;
    padding: 0 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

#go-btn:hover {
    background-color: #0055cc;
}

/* Footer Bottom Right Elements */
.footer-buttons {
    position: absolute;
    bottom: 24px;
    right: 24px;
    display: flex;
    gap: 12px;
}

.footer-btn {
    background-color: #0077ff;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
}

.footer-btn:hover {
    background-color: #0055cc;
}

/* Search Results Layout Elements */
#results-view {
    background-color: #030e21;
}

.results-header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 24px;
    border-bottom: 1px solid #112547;
    background-color: #061530;
}

.results-logo {
    cursor: pointer;
    font-weight: 800;
    font-size: 20px;
}

.text-super-sm { color: #ffffff; margin-right: 4px; }
.box-nova-sm { background-color: #ffffff; color: #030e21; padding: 1px 6px; border-radius: 2px; }

.results-search-box {
    display: flex;
    width: 450px;
    background-color: #ffffff;
    border-radius: 4px;
    overflow: hidden;
}

#results-search-input {
    flex-grow: 1;
    border: none;
    padding: 6px 12px;
    font-size: 14px;
    outline: none;
    color: #333333;
}

#results-go-btn {
    background-color: #0077ff;
    color: #ffffff;
    border: none;
    padding: 0 16px;
    cursor: pointer;
}

/* Dynamic Result Feed Blocks */
.results-body {
    flex-grow: 1;
    padding: 24px;
    overflow-y: auto;
}

.search-summary {
    font-size: 14px;
    color: #718096;
    margin-bottom: 20px;
}

#query-highlight {
    color: #0077ff;
    font-weight: 600;
}

.result-item {
    margin-bottom: 24px;
    max-width: 650px;
}

.result-item h3 {
    font-size: 18px;
    margin-bottom: 4px;
}

.result-item h3 a {
    color: #4da3ff;
    text-decoration: none;
}

.result-item h3 a:hover {
    text-decoration: underline;
}

.result-url {
    font-size: 12px;
    color: #10b981;
    margin-bottom: 4px;
    display: block;
}

.result-snippet {
    font-size: 14px;
    color: #cbd5e1;
    line-height: 1.5;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // UI Elements
    const homepageView = document.getElementById('homepage-view');
    const resultsView = document.getElementById('results-view');
    const searchInput = document.getElementById('search-input');
    const goBtn = document.getElementById('go-btn');
    const resultsSearchInput = document.getElementById('results-search-input');
    const resultsGoBtn = document.getElementById('results-go-btn');
    const queryHighlight = document.getElementById('query-highlight');
    const resultsList = document.getElementById('results-list');
    
    const backBtn = document.getElementById('back-btn');
    const logoReturn = document.getElementById('logo-return');
    const urlInput = document.getElementById('url-input');

    // Database of mock planetary data matching the SuperNova search concept
    const mockDatabase = [
        { title: "Andromeda Galaxy - Astronomy Guide", url: "https://spacefact.org", snippet: "Explore coordinates, planetary structures, and recent exploration telescope imagery of our closest galactic neighbor." },
        { title: "How to Build Rocket Propulsion Engines", url: "https://star-drive.net", snippet: "A technical guide covering chemical reactions, ion thusters, and structural system configurations for modern spaceships." },
        { title: "Space Exploration News & Mission Updates", url: "https://cosmictimes.com", snippet: "Breaking discoveries from remote rovers across the Martian landscape, outer asteroids, and deep space telemetry feeds." },
        { title: "Supernova Explorations: The Lifespan of Stars", url: "https://astrophysics.edu", snippet: "An analytical breakdown detailing stellar collapse occurrences, high-energy nebula formation, and cosmic dust clouds." },
        { title: "Coding Web Browsers using Simple Javascript Applications", url: "https://koderdev.io", snippet: "Learn core procedures to build state-switching views, address inputs, and layout viewports within local editors." }
    ];

    // Function to run search actions
    function executeSearch(query) {
        if (!query.trim()) return;

        // Sync inputs across both panels
        searchInput.value = query;
        resultsSearchInput.value = query;
        queryHighlight.textContent = `"${query}"`;
        
        // Update mock browser address input
        urlInput.value = `http://localhost:9898/SuperNova/Search?q=${encodeURIComponent(query)}`;

        // Clear any old items
        resultsList.innerHTML = '';

        // Filter database to match words, or return random elements if no match
        let matches = mockDatabase.filter(item => 
            item.title.toLowerCase().includes(query.toLowerCase()) || 
            item.snippet.toLowerCase().includes(query.toLowerCase())
        );

        // Fallback layout if specific terms aren't in the mock list
        if (matches.length === 0) {
            matches = [
                {
                    title: `${query} - Cosmological Search Resource`,
                    url: `https://supernova.search{encodeURIComponent(query)}`,
                    snippet: `Deep space data scanners returned global index files matching your inquiry parameters for "${query}". No dangerous dark matter detected.`
                },
                ...mockDatabase.slice(0, 2) // Append standard items to fill screen
            ];
        }

        // Render nodes into existence
        matches.forEach(item => {
            const block = document.createElement('div');
            block.className = 'result-item';
            block.innerHTML = `
                <h3><a href="#" onclick="alert('Navigating to live external sites requires an active proxy domain.'); return false;">${item.title}</a></h3>
                <span class="result-url">${item.url}</span>
                <p class="result-snippet">${item.snippet}</p>
            `;
            resultsList.appendChild(block);
        });

        // Toggle visibility state classes
        homepageView.classList.remove('active');
        resultsView.classList.add('active');
    }

    // Function to step back to home layout
    function returnToHome() {
        resultsView.classList.remove('active');
        homepageView.classList.add('active');
        urlInput.value = "http://localhost:9898/SuperNova/Home.html";
        searchInput.value = '';
    }

    // Event Triggers
    goBtn.addEventListener('click', () => executeSearch(searchInput.value));
    resultsGoBtn.addEventListener('click', () => executeSearch(resultsSearchInput.value));

    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeSearch(searchInput.value); });
    resultsSearchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeSearch(resultsSearchInput.value); });

    // Back paths
    backBtn.addEventListener('click', () => { if (resultsView.classList.contains('active')) returnToHome(); });
    logoReturn.addEventListener('click', returnToHome);
});
</script>
