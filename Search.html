<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperNova Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="browser-container">
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="back-btn" class="btn" title="Back">←</button>
                <button id="forward-btn" class="btn" title="Forward">→</button>
                <button id="reload-btn" class="btn" title="Reload">↻</button>
            </div>
            <div class="address-bar-container">
                <input type="text" id="url-input" readonly>
            </div>
        </div>

        <div class="viewport">
            <div class="subpage-header">
                <a href="Home.html" class="results-logo">
                    <span class="text-super-sm">SUPER</span><span class="box-nova-sm">NOVA</span>
                </a>
                <div class="results-search-box">
                    <input type="text" id="results-search-input">
                    <button id="results-go-btn">Search</button>
                </div>
            </div>

            <div class="results-body">
                <p class="search-summary">Showing results for: <span id="query-highlight"></span></p>
                <div id="results-list"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q') || '';

        const resultsSearchInput = document.getElementById('results-search-input');
        const resultsGoBtn = document.getElementById('results-go-btn');
        const queryHighlight = document.getElementById('query-highlight');
        const resultsList = document.getElementById('results-list');

        resultsSearchInput.value = query;
        queryHighlight.textContent = query;
        document.title = `${query} - SuperNova Search`;

        function newSearch() {
            const q = resultsSearchInput.value.trim();
            if (q) window.location.href = `Search.html?q=${encodeURIComponent(q)}`;
        }

        resultsGoBtn.addEventListener('click', newSearch);
        resultsSearchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') newSearch(); });

        async function runSearch(q) {
            if (!q) {
                resultsList.innerHTML = '<p style="color: #cbd5e1;">Enter a search term above.</p>';
                return;
            }

            resultsList.innerHTML = '<p style="color: #a0c4ff;">Scanning the galaxy for results...</p>';
            const qLower = q.toLowerCase();
            const customSites = getCustomSites();
            const settings = getSettings();

            const localMatches = customSites.filter(site =>
                site.title.toLowerCase().includes(qLower) ||
                site.snippet.toLowerCase().includes(qLower) ||
                site.url.toLowerCase().includes(qLower)
            );

            let html = '';
            localMatches.forEach(site => {
                html += `
                    <div class="result-item">
                        <h3><a href="${site.url}" target="_blank">${site.title}</a></h3>
                        <span class="result-url">${site.url} ★ SuperNova Indexed</span>
                        <p class="result-snippet">${site.snippet}</p>
                    </div>
                `;
            });

            if (settings.useWiki) {
                try {
                    const endpoint = `https://wikipedia.org{encodeURIComponent(q)}&format=json&origin=*`;
                    const response = await fetch(endpoint);
                    const data = await response.json();

                    data.query.search.forEach(item => {
                        const pageUrl = `https://wikipedia.org{encodeURIComponent(item.title.replace(/ /g, '_'))}`;
                        html += `
                            <div class="result-item">
                                <h3><a href="${pageUrl}" target="_blank">${item.title} - Wikipedia</a></h3>
                                <span class="result-url">${pageUrl}</span>
                                <p class="result-snippet">${item.snippet}...</p>
                            </div>
                        `;
                    });
                } catch (err) {
                    if (!html) {
                        html = '<p style="color: #f87171;">Could not reach external search network.</p>';
                    }
                }
            }

            resultsList.innerHTML = html || '<p style="color: #cbd5e1;">No results found in this sector.</p>';
        }

        runSearch(query);
    </script>
</body>
</html>
