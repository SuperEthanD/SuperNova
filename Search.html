<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        .search-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }

/* Navigation Tabs */
.navbar {
  display: flex;
  gap: 20px;
}

.nav-item {
  background: none;
  border: none;
  padding: 10px 4px;
  font-size: 14px;
  color: #5f6368;
  cursor: pointer;
  position: relative;
}

.nav-item.active {
  color: #1a73e8;
  font-weight: bold;
}

.nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background-color: #1a73e8;
}

/* Results Formatting */
.results-container {
  max-width: 800px;
  margin: 20px auto;
  padding: 0 20px;
}

.status-message {
  color: #70757a;
  text-align: center;
  margin-top: 40px;
}

/* Specific styling depending on Result Class */
.result-card.website {
  margin-bottom: 25px;
}

.result-card.website a {
  color: #1a0dab;
  font-size: 20px;
  text-decoration: none;
}

.result-card.website a:hover {
  text-decoration: underline;
}

.result-card.website p {
  font-size: 14px;
  color: #4d5156;
  margin-top: 5px;
}

/* Image & Video Grid Integration */
.grid-layout {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.result-card.image img, .result-card.video .video-thumb {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #dadce0;
}

.result-card.video {
  position: relative;
}

.video-duration {
  position: absolute;
  bottom: 25px;
  right: 8px;
  background: rgba(0,0,0,0.8);
  color: white;
  font-size: 12px;
  padding: 2px 4px;
  border-radius: 4px;
}

    </style>
</head>
<body>


<h2 style="font-family: 'Trebuchet MS', sans-serif; color: white;">Travel the Galaxy!</h2>
    
    <!-- Search Input and Button -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Type your search here...">
        <button id="searchButton">Go!</button>
    </div>

<!-- Navigation Tabs -->
    <nav class="navbar">
      <button class="nav-item active" data-type="website">Websites</button>
      <button class="nav-item" data-type="image">Images</button>
      <button class="nav-item" data-type="video">Videos</button>
    </nav>
  </header>

  <!-- Results Feed -->
  <main class="results-container" id="results-container">
    <!-- JavaScript will inject results here -->
    <div class="status-message">Type a query to search</div>
  </main>

  <script src="script.js"></script>

    <!-- Container where results will appear -->
    <div id="searchResults"></div>

   

<!-- Background -->
<style>

body {

margin: 0; 
padding: 0;
background-image: url('Supernova_Browser-Background.jpg');
background-size: cover;
background-repeat: no-repeat;
background-position: center;
height: 100vh;

}

</style>

<body background='Supernove_Browser-Background.jpg'>
